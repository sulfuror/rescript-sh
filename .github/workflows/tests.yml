name: CI Tests

on:
  push:
    branches:
      - master
      - testing
  pull_request:
    branches:
      - master
      - testing

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y restic shellcheck

      - name: Build Binary
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Run Test Suite
        run: |
          cd tests
          chmod +x run_all.sh
          ./run_all.sh
